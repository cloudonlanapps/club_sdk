analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Documentation comments on public APIs are not enforced.
    public_member_api_docs: false
    # Use relative imports within the same package. very_good_analysis
    # enables always_use_package_imports (the opposite rule) and not
    # prefer_relative_imports, so turn the one off and the other on.
    always_use_package_imports: false
    prefer_relative_imports: true
