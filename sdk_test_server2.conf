# sdk_test_server2.conf — native club_server stack for the club_sdk integration test suite
# (config 2, `just test-server2`), the counterpart of sdk_test_server1.conf: the credit
# system, evaluations and event marketing on; identity verification, the
# extended profile and applications off, so the suites' verification-off and
# module-off (503) cases run here (#86).
# Started by native_deploy's background_server.sh; nothing here is secret.

[product]
# club_server is cloned from git at ref into the run directory. To test
# against a local checkout instead (e.g. uncommitted server changes), set
# source to its path, relative to this file.
source = https://github.com/cloudonlanapps/club_server.git
ref    = main

[server]
port               = 8302
db_port            = 5452
debug              = false
bootstrap_password = testboot
secret_key         = native-test-secret-key

[settings]
cors_allowed_origins     = *
club_name                = Local Test Club
club_short_name          = LTC
login_url                = http://localhost:<port>
server_base_url          = http://localhost:<port>
email_from_transactional = admin@localhost.invalid
email_from_broadcast     = noreply@localhost.invalid
email_theme_color        = #E8772E
environment              = development
# base64 of 32 zero bytes: lets encrypted uploads work on a throwaway stack
encryption_key           = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
credit_system_enabled          = true
evaluations_enabled            = true
event_marketing_enabled        = true
extended_profile_enabled       = false
applications_enabled           = false
# off: a sign-up lands at pending with no identity document (club_server#428)
identity_verification_required = false
# the club's country calling code, reported by GET /v1/capabilities
default_country_code     = 91
# Swagger, ReDoc and /openapi.json, off by default on the server (club_server#78);
# the endpoint contract test reads /openapi.json
api_docs_enabled = true
